# Blueprint Render — connecte ce repo sur render.com, Render détecte ce
# fichier automatiquement ("New +" → "Blueprint"). Les variables marquées
# `sync: false` sont à saisir dans le dashboard Render (jamais commitées ici).
services:
  - type: web
    name: quickjob-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
