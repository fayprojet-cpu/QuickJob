# Blueprint Render. Ce fichier N'EST PAS à la racine du dépôt Git (le dépôt
# contient d'autres projets sous livrables/) : dans le dashboard Render,
# "New +" → "Blueprint" → champ "Blueprint Path" → saisir
# "livrables/applications/2026-09_quickjob/render.yaml".
# `rootDir` ancre dockerfilePath/dockerContext sur le dossier du projet
# quickjob (chemins relatifs à rootDir, pas à la racine du dépôt).
# Les variables marquées `sync: false` sont à saisir dans le dashboard Render
# (jamais commitées ici).
services:
  - type: web
    name: quickjob-api
    runtime: docker
    rootDir: livrables/applications/2026-09_quickjob
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL/DIRECT_URL sont reconstruites dans docker-entrypoint.sh à
      # partir de ces morceaux (voir ce fichier pour le pourquoi : Render
      # altère la chaîne complète en transit, pas ces valeurs simples).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postgres
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      # Email (mot de passe oublié) — voir docs/EMAIL-SETUP.md.
      # BREVO_API_KEY (API HTTP, port 443) est utilisée en priorité : Render
      # bloque les connexions SMTP sortantes (port 587), donc SMTP_* seul ne
      # fonctionne pas ici. Si tout est absent, l'API logge le lien au lieu
      # de l'envoyer.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
